<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Live — Join me">
  <meta property="og:description" content="A private space for two">
  <title>Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Full-screen tap-receive overlay -->
  <div id="tap-overlay" class="tap-overlay"></div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <!-- ========== SETUP SCREEN ========== -->
  <div id="screen-setup" class="screen active">
    <div class="setup-wrap">
      <div class="logo-mark"><span>&#9829;</span></div>
      <h1>Live</h1>
      <p class="tagline">A private space for two</p>

      <div id="view-create">
        <button id="btn-create" class="btn primary">Create Room</button>
      </div>

      <div id="view-invite" hidden>
        <p class="label">Share this link with your partner</p>
        <div class="link-row">
          <input id="invite-url" type="text" readonly>
          <button id="btn-copy" class="btn icon" aria-label="Copy link">&#128203;</button>
        </div>
        <div class="dots"><span></span><span></span><span></span></div>
        <p class="muted">Waiting for partner&hellip;</p>
      </div>

      <div id="view-join" hidden>
        <div class="dots"><span></span><span></span><span></span></div>
        <p class="muted">Joining room&hellip;</p>
      </div>
    </div>
  </div>

  <!-- ========== MAIN SCREEN ========== -->
  <div id="screen-main" class="screen">
    <header class="bar">
      <div id="status" class="status offline">
        <span class="dot"></span>
        <span id="status-text">Offline</span>
      </div>
      <button id="btn-settings" class="btn icon" aria-label="Settings">&#9881;&#65039;</button>
    </header>

    <div class="center">
      <button id="btn-tap" class="tap-btn" disabled aria-label="Send tap">
        <span class="rings"><i></i><i></i><i></i></span>
        <span class="heart">&#9829;</span>
      </button>
      <p class="hint">Tap to send a pulse</p>
    </div>

    <nav class="actions">
      <button id="btn-video" class="act" disabled>
        <span>&#128249;</span>Video
      </button>
      <button id="btn-audio" class="act" disabled>
        <span>&#128222;</span>Audio
      </button>
    </nav>

    <!-- Settings sheet -->
    <div id="settings" class="sheet-backdrop" hidden>
      <div class="sheet">
        <div class="sheet-head">
          <h2>Settings</h2>
          <button id="btn-close-settings" class="btn icon">&#10005;</button>
        </div>
        <label class="row">
          <span>Auto-answer calls</span>
          <input id="chk-autoanswer" type="checkbox" checked>
        </label>
        <div class="row">
          <span>Paired room</span>
          <code id="display-room">&mdash;</code>
        </div>
        <div id="settings-invite-row" class="row" hidden>
          <span>Invite link</span>
          <button id="btn-copy-settings" class="btn copy-sm">Copy</button>
        </div>
        <button id="btn-reset" class="btn danger">Unpair &amp; Reset</button>
      </div>
    </div>
  </div>

  <!-- ========== CALL SCREEN ========== -->
  <div id="screen-call" class="screen">
    <video id="vid-remote" autoplay playsinline></video>
    <video id="vid-local"  autoplay playsinline muted></video>
    <div id="call-status" class="call-status">Connecting&hellip;</div>
    <div class="call-bar">
      <button id="btn-mic"    class="cbtn" title="Toggle mic"><span id="mic-icon">&#127908;</span></button>
      <button id="btn-hangup" class="cbtn end" title="End call"><span>&#10005;</span></button>
      <button id="btn-cam"    class="cbtn" title="Toggle camera"><span id="cam-icon">&#128247;</span></button>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
