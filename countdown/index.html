<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Countdown</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%8F%B3</text></svg>"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --fg: #f2f2f4;
        --soft: #c4c4cc;
        --muted: #6e6e78;
        /* One size drives the whole layout. fit() replaces this estimate
           with a measured size once the digits have rendered. */
        --clock: min(13.5vw, 40vh);
      }

      * {
        box-sizing: border-box;
      }

      /* Author display rules (.nav, .clock) would otherwise beat the UA's
         [hidden] style and show elements the script has hidden. */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .stage {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: calc(var(--clock) * 0.22);
        padding-bottom: 4vh; /* sit slightly above true center */
        transition: opacity 0.6s ease;
      }

      /* Hidden until countdowns.json arrives, so the page never flashes an
         empty or zeroed readout. */
      .loading .stage {
        opacity: 0;
      }

      .title {
        margin: 0;
        /* The extra 0.12em on the left balances the trailing letter-spacing
           so the title stays optically centered. */
        padding: 0 1rem 0 calc(1rem + 0.12em);
        font-size: max(1.75rem, calc(var(--clock) * 0.4));
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: 0.12em;
        text-align: center;
        color: var(--soft);
      }

      .row {
        position: relative;
        align-self: stretch;
        display: flex;
        justify-content: center;
      }

      .clock {
        font-size: var(--clock);
        font-weight: 300;
        font-variant-numeric: tabular-nums; /* no width jitter as digits change */
        line-height: 1;
        white-space: nowrap;
      }

      /* Drawn dots instead of a ":" glyph. A glyph colon sits at a different
         height in every font (low in Segoe UI); these always center on the
         digits' cap height. With nothing in flow, the box's baseline is its
         bottom edge, so it rests on the digits' baseline. */
      .sep {
        position: relative;
        display: inline-block;
        width: 0.28em;
        height: 0.7em;
        height: 1cap;
        color: var(--muted);
      }

      .sep::before,
      .sep::after {
        content: "";
        position: absolute;
        left: 50%;
        width: 0.08em;
        height: 0.08em;
        border-radius: 50%;
        background: currentColor;
        transform: translate(-50%, 50%);
      }

      .sep::before {
        bottom: 80%;
      }

      .sep::after {
        bottom: 20%;
      }

      /* The real ":" stays in the DOM for copy/paste and screen readers. */
      .sep > span {
        position: absolute;
        opacity: 0;
      }

      .nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: max(48px, 9vw);
        height: max(100%, 96px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--fg);
        opacity: 0.3;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .nav-prev {
        left: 0;
      }

      .nav-next {
        right: 0;
      }

      .nav svg {
        width: clamp(24px, 3.5vw, 56px);
        height: auto;
      }

      .nav:focus-visible {
        opacity: 0.9;
        outline: 2px solid var(--muted);
        outline-offset: -4px;
      }

      /* Hover only where there is a real pointer; on touch screens :hover
         sticks after a tap. */
      @media (hover: hover) {
        .nav:hover {
          opacity: 0.9;
        }
      }

      /* Tap bubble: anchored with its tail just above the tap point, pops
         in, then drifts upward as it fades. */
      .bubble {
        position: fixed;
        z-index: 10;
        padding: 0.45em 0.9em;
        border-radius: 0.8em;
        background: var(--fg);
        color: var(--bg);
        font-size: clamp(1rem, calc(var(--clock) * 0.15), 1.6rem);
        font-weight: 500;
        line-height: 1.3;
        white-space: nowrap;
        pointer-events: none;
        translate: -50% calc(-100% - 0.7em);
        transform-origin: 50% 100%;
        animation: bubble 2s ease-out forwards;
      }

      .bubble::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        translate: -50% 0;
        border: 0.4em solid transparent;
        border-top-color: var(--fg);
      }

      @keyframes bubble {
        0% {
          opacity: 0;
          transform: translateY(0.5em) scale(0.5);
        }
        14% {
          opacity: 1;
          transform: translateY(0) scale(1.08);
        }
        24% {
          transform: translateY(0) scale(1);
        }
        55% {
          opacity: 1;
          transform: translateY(-0.8em);
        }
        100% {
          opacity: 0;
          transform: translateY(-4em);
        }
      }

      @keyframes bubble-fade {
        0%,
        60% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stage,
        .nav {
          transition: none;
        }

        .bubble {
          animation-name: bubble-fade;
        }
      }
    </style>
  </head>
  <body class="loading">
    <main class="stage">
      <h1 id="title" class="title"></h1>
      <div class="row">
        <button id="prev" class="nav nav-prev" type="button" aria-label="Previous countdown" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div id="clock" class="clock" role="timer">
          <span data-unit="d"></span><span class="sep"><span>:</span></span><span data-unit="h"></span><span class="sep"><span>:</span></span><span data-unit="m"></span><span class="sep"><span>:</span></span><span data-unit="s"></span>
        </div>
        <button id="next" class="nav nav-next" type="button" aria-label="Next countdown" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </main>

    <script>
      const titleEl = document.getElementById("title");
      const clockEl = document.getElementById("clock");
      const unitEls = clockEl.querySelectorAll("[data-unit]"); // d, h, m, s
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");

      let items = [];
      let index = 0;

      const pad = (n) => String(n).padStart(2, "0");

      // Whole seconds left, rounded up so the readout reaches zero exactly at
      // the target. An expired countdown holds at 0:00:00:00 until its entry
      // is removed from countdowns.json.
      function parts(ms) {
        const total = Math.max(0, Math.ceil(ms / 1000));
        return [
          String(Math.floor(total / 86400)),
          pad(Math.floor((total % 86400) / 3600)),
          pad(Math.floor((total % 3600) / 60)),
          pad(total % 60),
        ];
      }

      // Recomputed from the wall clock on every tick, never decremented, so
      // background-tab timer throttling can't make it drift.
      function tick() {
        const item = items[index];
        if (!item) return;
        parts(item.time - Date.now()).forEach((text, i) => {
          if (unitEls[i].textContent !== text) unitEls[i].textContent = text;
        });
      }

      // Size the readout to span ~80% of the width in whatever font the
      // platform renders (digit widths differ a lot between Segoe UI, SF Pro
      // and Roboto), capped at 40% of the height. Sized for at least three
      // day digits so it doesn't jump when the day count drops below 100.
      function fit() {
        const fontPx = parseFloat(getComputedStyle(clockEl).fontSize);
        const digitEm = unitEls[3].getBoundingClientRect().width / 2 / fontPx;
        const sepEm = clockEl.querySelector(".sep").getBoundingClientRect().width / fontPx;
        const digits = Math.max(3, unitEls[0].textContent.length) + 6;
        const widthEm = digits * digitEm + 3 * sepEm;
        const size = Math.min((innerWidth * 0.8) / widthEm, innerHeight * 0.4);
        document.documentElement.style.setProperty("--clock", `${size}px`);
      }

      function render() {
        const item = items[index];
        titleEl.textContent = item.title;
        document.title = `${item.title} · Countdown`;
        tick();
        fit();
      }

      function showMessage(text) {
        titleEl.textContent = text;
        clockEl.hidden = true;
      }

      function go(delta) {
        index = (index + delta + items.length) % items.length;
        // replaceState: toggling shouldn't fill up the back-button history.
        history.replaceState(null, "", `#${encodeURIComponent(items[index].id)}`);
        render();
      }

      function indexFromHash() {
        const id = decodeURIComponent(location.hash.slice(1));
        const i = items.findIndex((c) => c.id === id);
        return i >= 0 ? i : 0;
      }

      const HOUR = 3600000;
      const DAY = 24 * HOUR;

      // What a tap says, by time remaining: the first tier whose limit
      // covers the remaining time wins.
      const TAP_LINES = [
        [0, ["到啦！", "时间到！", "终于等到了！", "就是现在！"]],
        [HOUR, ["最后冲刺！", "马上马上！", "几分钟就到了！", "深呼吸～"]],
        [DAY, ["最后一天！", "只剩几个小时了！", "紧张吗？", "最后倒数！", "马上就到啦"]],
        [7 * DAY, ["快到了！", "准备好了吗？", "就这几天了！", "最后一周！", "心跳加速中…"]],
        [30 * DAY, ["越来越近了", "只剩几个星期了！", "开始期待了吗？", "快了快了", "进入最后一个月啦"]],
        [60 * DAY, ["一两个月而已", "又近了一天", "坚持住！", "日子会过得很快的", "再等等就好"]],
        [Infinity, ["耐心点", "点也不会变更快的", "还早着呢", "急也没用哦", "再点也还是这么久", "慢慢等，好好过"]],
      ];

      let lastLine = "";

      // Random line from the current tier, never the same one twice in a row.
      function pickLine(ms) {
        const [, lines] = TAP_LINES.find(([max]) => ms <= max);
        let line;
        do line = lines[Math.floor(Math.random() * lines.length)];
        while (line === lastLine && lines.length > 1);
        return (lastLine = line);
      }

      function say(x, y) {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = pickLine(items[index].time - Date.now());
        bubble.addEventListener("animationend", () => bubble.remove());
        document.body.append(bubble);
        // Keep it on screen: near an edge the bubble shifts off the tap point.
        // offsetWidth/Height ignore the pop-in scale that's mid-animation.
        const half = bubble.offsetWidth / 2 + 8;
        bubble.style.left = `${Math.min(Math.max(x, half), innerWidth - half)}px`;
        bubble.style.top = `${Math.max(y, bubble.offsetHeight * 1.6 + 8)}px`;
      }

      function enableNavigation() {
        prevBtn.hidden = false;
        nextBtn.hidden = false;
        prevBtn.addEventListener("click", () => go(-1));
        nextBtn.addEventListener("click", () => go(1));

        document.addEventListener("keydown", (e) => {
          if (e.altKey || e.ctrlKey || e.metaKey) return; // leave Alt+← (back) alone
          if (e.key === "ArrowLeft") go(-1);
          else if (e.key === "ArrowRight") go(1);
        });

        let startX = 0;
        let startY = 0;
        document.addEventListener(
          "touchstart",
          (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
          },
          { passive: true },
        );
        document.addEventListener("touchend", (e) => {
          const dx = e.changedTouches[0].clientX - startX;
          const dy = e.changedTouches[0].clientY - startY;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
        });

        window.addEventListener("hashchange", () => {
          index = indexFromHash();
          render();
        });
      }

      async function init() {
        try {
          // Absolute path so the fetch still resolves if the page is ever
          // served at /countdown without the trailing slash.
          const res = await fetch("/countdown/countdowns.json", { cache: "no-cache" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          items = (Array.isArray(data) ? data : [])
            .map((c) => ({ ...c, time: Date.parse(c?.target) }))
            .filter((c) => c.id && c.title && !Number.isNaN(c.time));
        } catch (err) {
          console.error("Couldn't load countdowns.json:", err);
          showMessage("Couldn't load countdowns");
          return;
        }

        if (!items.length) {
          showMessage("No countdowns");
          return;
        }

        index = indexFromHash();
        if (items.length > 1) enableNavigation();
        render();
        window.addEventListener("resize", fit);
        // click, not pointerdown: a swipe never produces a click, so swiping
        // between countdowns doesn't also spawn a bubble.
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".nav")) say(e.clientX, e.clientY);
        });
        // 4x a second so each second flips promptly; the DOM only changes
        // when a digit does.
        setInterval(tick, 250);
      }

      init().finally(() => document.body.classList.remove("loading"));
    </script>
  </body>
</html>
