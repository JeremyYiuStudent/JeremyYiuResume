  <body>
    <div id="stage" class="stage">
      <!-- Layer order, back to front. Phase 2/3 mount the character SVG into
           #character-layer; Phase 7 draws into #fx-canvas.

           #speech-layer sits above the character so a bubble is never behind
           his hair, and below the effects so sparkles read as being in front
           of everything. It is the one layer that is NOT aria-hidden: the
           canvases are decorative, but a line he says is real content. -->
      <canvas id="starfield-canvas" class="layer" aria-hidden="true"></canvas>
      <div id="character-layer" class="layer"></div>
      <div id="speech-layer" class="layer"></div>
      <canvas id="fx-canvas" class="layer" aria-hidden="true"></canvas>
    </div>
  </body>
